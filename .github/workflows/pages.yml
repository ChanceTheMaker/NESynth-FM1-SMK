name: Publish NESynth
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native reference for browser parity checks
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); from prepare_core import prepare; prepare()"
          g++ -std=c++11 -O2 -fno-strict-aliasing -Wno-write-strings -Isrc -Ibuild/infones build/infones/InfoNES.cpp build/infones/K6502.cpp build/infones/InfoNES_pAPU.cpp src/mapper.cpp src/nes_port.cpp tests/runtime.cpp -o build/runtime-test
          ./build/runtime-test web/diagnostic.nes
          cc -O1 -UNDEBUG -Isrc tests/smk37_game_controls.c -o build/smk37-controls
          ./build/smk37-controls
          cc -O1 -UNDEBUG tests/smk37_display.c -o build/smk37-display
          ./build/smk37-display
          python tests/diagnostics.py
          cc -O1 -UNDEBUG tests/smk37_scan.c -o build/smk37-scan
          ./build/smk37-scan
      - name: Check shipped assets and firmware builder
        run: npm run test:site
      - name: Check SMK model packages and protected flash updater
        run: |
          mkdir -p build/smk37
          curl --fail --location --retry 2 https://raw.githubusercontent.com/jonathaslacerda/smk-37-pro-docs/ab85d7340163ba9e171dc9396e31c034829bbc02/firmware/smk37pro/SMK-37_Pro_016.fwsc -o build/smk37/stock-pro.fwsc
          curl --fail --location --retry 2 https://raw.githubusercontent.com/jonathaslacerda/smk-37-pro-docs/ab85d7340163ba9e171dc9396e31c034829bbc02/firmware/smk37elite/SMK-37_Elite_016.fwsc -o build/smk37/stock-elite.fwsc
          npm run test:smk -- build/smk37/stock-pro.fwsc build/smk37/stock-elite.fwsc
          node tests/firmware_file.mjs build/smk37/stock-pro.fwsc build/smk37/stock-elite.fwsc
          node tests/nesynth_firmware.mjs build/smk37/stock-pro.fwsc build/smk37/stock-elite.fwsc
          cc -O1 -UNDEBUG -DTEST_PUBLIC -Ivendor/smk-updater vendor/smk-updater/update_test.c -o build/smk37-update-test
          ./build/smk37-update-test
          ./build/smk37-update-test build/smk37/synthetic-0.bin build/smk37/candidate-0.smkupdate
          ./build/smk37-update-test build/smk37/synthetic-1.bin build/smk37/candidate-1.smkupdate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
