name: Bluetooth loader prototype checks
on:
  push:
    branches: [feat/bluetooth-loader-prototype]
  pull_request:
    paths:
      - 'experiments/bluetooth/**'
      - 'tools/inspect_ble_calibration.py'
      - 'tools/build_bluetooth_probe.py'
      - 'tools/package_bluetooth_diagnostic.mjs'
      - 'tools/test_bluetooth_diagnostic.py'
      - 'tools/inspect_bluetooth_diagnostic.py'
      - 'tools/extract_private_rf.c'
      - 'tests/private_calibration_guard.c'
      - 'tests/bluetooth_status.py'
      - 'tests/rom_transfer.c'
      - 'tests/ble_calibration.py'
      - 'tests/rf_calibration.c'
      - 'tests/diagnostic_gatt.c'
      - 'tests/diagnostic_peripheral.c'
      - '.github/workflows/bluetooth-prototype.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate bounded cartridge receiver
        run: |
          mkdir -p build
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/rom_transfer.c experiments/bluetooth/rom_transfer.c -o build/rom-transfer-test
          ./build/rom-transfer-test
      - name: Validate read-only calibration inspector
        run: python3 tests/ble_calibration.py
      - name: Validate read-only Bluetooth status decoder
        run: python3 tests/bluetooth_status.py
      - name: Validate private calibration device match
        run: |
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/private_calibration_guard.c -o build/private-calibration-guard-test
          ./build/private-calibration-guard-test
          cc -O1 -Wall -Wextra -Werror tools/extract_private_rf.c experiments/bluetooth/rf_calibration.c -o build/extract-private-rf
      - name: Validate RF selection and diagnostic peripheral
        run: |
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/rf_calibration.c experiments/bluetooth/rf_calibration.c -o build/rf-test
          ./build/rf-test
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/diagnostic_gatt.c experiments/bluetooth/diagnostic_gatt.c -o build/gatt-test
          ./build/gatt-test
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/diagnostic_peripheral.c experiments/bluetooth/diagnostic_gatt.c -o build/peripheral-test
          ./build/peripheral-test
