</style><title id="fm1-wire-title" data-i18n="ui.wireTitle">FM-1 synthesizer wireframe</title>
<desc id="fm1-wire-desc" data-i18n="ui.wireDesc">The FM-1's rounded enclosure, eight rotary controls, central screen, twelve function buttons, octave buttons, and 27 touch keys.</desc>
